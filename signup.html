<!DOCTYPE html>
<html lang="en">
<head>

  <title>Sign Up</title>
  <link rel="stylesheet" href="signuo.css" />
</head>
<body>
  <div class="signup-box">
    <h2>Create Account</h2>
    <form>
      <div class="input-group">
        <label for="fullname"><h5>Full Name</h5></label>
        <input type="text" id="fullname" name="fullname" required />
      </div>

      <div class="input-group">
        <label for="email"><h5>Email Address</h5></label>
        <input type="email" id="email" name="email" required />
      </div>
      
      <div class="input-group">
        <label for="Id Number"><h5>Id Number</h5></label>
        <input type="text" id="Id Number" name="Id Number" required />
      </div>

      <div class="input-group">
        <label for="password"><h5>Password</h5></label>
        <input type="password" id="password" name="password" required />
      </div>

      <div class="input-group">
        <label for="confirm-password"><h5>Confirm Password</h5></label>
        <input type="password" id="confirm-password" name="confirm-password" required />
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="terms" name="terms" required />
        <label for="terms">I agree to the <a href="#">terms and conditions</a></label>
      </div>

      <button type="submit"><a href="login.html">Sign Up</a></button>
    </form>

    <p class="login-text">Already have an account? <a href="login.html">Login here</a></p>
  </div>
</body>
</html>
