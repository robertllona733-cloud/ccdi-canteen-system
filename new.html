<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DelishBite Restaurant</title>
  <link rel="stylesheet" href="new.css" />
</head>
<body>
  <header>
    <h1>DelishBite Restaurant</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#menu">Menu</a>
      <a href="#order">Order</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <h2>Fresh Food, Fast Delivery</h2>
    <p>Order your favorite dishes and drinks with ease!</p>
    <a href="#order" class="btn">Order Now</a>
  </section>

  <section id="menu">
    <h2>Our Menu</h2>
    <div class="menu-grid">
      <div class="menu-item">
        <h3>Cheese Burger</h3>
        <p>$8.99</p>
      </div>
      <div class="menu-item">
        <h3>Margherita Pizza</h3>
        <p>$12.50</p>
      </div>
      <div class="menu-item">
        <h3>Lemonade</h3>
        <p>$3.00</p>
      </div>
      <div class="menu-item">
        <h3>Latte</h3>
        <p>$4.50</p>
      </div>
    </div>
  </section>

  <section id="order">
    <h2>Place Your Order</h2>
    <form>
      <label>Name:</label>
      <input type="text" name="name" required />
      
      <label>Select Item:</label>
      <select name="item">
        <option>Burger</option>
        <option>Pizza</option>
        <option>Lemonade</option>
        <option>Latte</option>
      </select>

      <label>Quantity:</label>
      <input type="number" name="quantity" min="1" value="1" />

      <button type="submit">Submit Order</button>
    </form>
  </section>

  <footer>
    <p>© 2025 DelishBite. All rights reserved.</p>
  </footer>
</body>
</html>
